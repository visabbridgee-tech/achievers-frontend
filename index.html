  const totalFee=student.subjects.reduce((a,s)=>a+(parseInt(s.fee)||0),0);

  const bal = fee.totalFee - fee.discount - fee.paid;
  const prevDue = Object.entries(student.fees)
    .filter(([k]) => k !== feeKey)
    .reduce((a, [, f]) => a + Math.max(0, f.totalFee - f.discount - f.paid), 0);
  const totalPayable = bal + prevDue + (fee.lateFee || 0);
  const afterDue = totalPayable + (settings.lateFeeAmount || 0);
  const dueDate = `${settings.dueDateDay} ${MONTHS[m]} ${y}`;

  const subRows = student.subjects.map(sub => {
    const t = teachers.find(x => x.id === sub.teacherId);

        <div><div style="font-size:0.55rem;color:#888;font-weight:700;">CHALLAN NO.</div><div style="font-weight:900;font-family:monospace;font-size:0.85rem;">${pad(fee.challanNo || settings.challanCounter || 930)}</div></div>

      .no-print{display:none!important;}

// ── TEACHER SALARY SLIP PRINT ─────────────────────────────────────────────────

function printSalarySlip(teacher, month, year, students, teacherAtt, settings) {
  const assigned = students.filter(s => s.active && s.subjects.some(x => x.teacherId === teacher.id));
  const revenue = assigned.reduce((a, s) => a + s.subjects.filter(x => x.teacherId === teacher.id).reduce((b, x) => b + (parseInt(x.fee) || 0), 0), 0);
  const commission = teacher.commissionType === "percentage"
    ? Math.round(revenue * (teacher.commissionValue / 100))
    : assigned.length * (parseInt(teacher.commissionValue) || 0);

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const attRows = [];
  let presentCount = 0, lateCount = 0, absentCount = 0, leaveCount = 0;

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    if (date > new Date()) break;
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const key = `${dateStr}-${teacher.id}`;
    const rec = teacherAtt[key];
    const dayName = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][date.getDay()];
    const isSun = date.getDay() === 0;
    let status = isSun ? "Holiday" : "—", color = "#bbb", bg = isSun ? "#f9f9f9" : "white";
    if (rec) {
      if (rec.status === "present") { status = "Present"; color = "#1a7a42"; bg = "#f0faf4"; presentCount++; }
      else if (rec.status === "late") { status = "LATE"; color = "#b07000"; bg = "#fffbf0"; lateCount++; }
      else if (rec.status === "absent") { status = "Absent"; color = "#b02020"; bg = "#fff5f5"; absentCount++; }
      else if (rec.status === "leave") { status = "Leave"; color = "#555"; bg = "#f5f5f5"; leaveCount++; }
    }
    attRows.push(`<tr style="background:${bg};">
      <td style="padding:3px 8px;font-size:0.72rem;color:#444;border-bottom:1px solid #f0f0f0;text-align:center;">${d}</td>
      <td style="padding:3px 8px;font-size:0.72rem;color:#666;border-bottom:1px solid #f0f0f0;">${dayName}</td>
      <td style="padding:3px 8px;font-size:0.72rem;font-weight:700;color:${color};border-bottom:1px solid #f0f0f0;">${status}${rec?.status === "late" ? ` <span style="font-size:0.62rem;color:#b07000;">(${rec.time || ""})</span>` : ""}</td>
    </tr>`);
  }

  const win = window.open("", "_blank");
  win.document.write(`<!DOCTYPE html><html><head><title>Salary Slip — ${teacher.name} — ${MONTHS[month]} ${year}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"Segoe UI",sans-serif;background:white;color:#1a2740;}
    .print-btn{background:#0f2744;color:white;border:none;padding:9px 22px;border-radius:7px;cursor:pointer;font-size:0.88rem;font-weight:700;}
    @media print{.no-print{display:none!important;}@page{size:A4;margin:10mm;}}
  </style></head><body>
  <div class="no-print" style="padding:12px 20px;background:#f0f4f8;border-bottom:2px solid #0f2744;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-weight:700;color:#0f2744;font-size:0.9rem;">${teacher.name} — Salary Slip — ${MONTHS[month]} ${year}</span>
    <button class="print-btn" onclick="window.print()">Print Salary Slip</button>
  </div>

  <!-- Header -->
  <div style="background:#0f2744;color:white;padding:16px 24px;display:flex;align-items:center;gap:16px;">
    <img src="${LOGO}" style="height:52px;"/>
    <div style="flex:1;">
      <div style="font-size:1.1rem;font-weight:900;letter-spacing:1px;">${settings.academyName.toUpperCase()}</div>
      <div style="opacity:0.6;font-size:0.72rem;margin-top:2px;">TEACHER SALARY SLIP</div>
      <div style="opacity:0.6;font-size:0.7rem;">${settings.address} | ${settings.phone}</div>
    </div>
    <div style="text-align:right;background:rgba(255,255,255,0.1);padding:10px 16px;border-radius:8px;">
      <div style="font-size:0.62rem;opacity:0.7;text-transform:uppercase;letter-spacing:1px;">Month</div>
      <div style="font-size:1rem;font-weight:900;">${MONTHS[month]} ${year}</div>
    </div>
  </div>

  <div style="padding:18px 24px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
      <!-- Teacher Info -->
      <div style="border:1.5px solid #d0dce8;border-radius:8px;overflow:hidden;">
        <div style="background:#0f2744;color:white;padding:8px 12px;font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;">Teacher Information</div>
        <div style="padding:10px 12px;">
          ${[["Name", teacher.name], ["Phone", teacher.phone], ["CNIC", teacher.cnic || "—"], ["Subjects", teacher.subjects.join(", ")], ["Commission", teacher.commissionType === "percentage" ? `${teacher.commissionValue}% of revenue` : `Rs. ${fmt(teacher.commissionValue)} per student`]]

    <div style="display:flex;justify-content:space-between;margin-top:24px;padding-top:16px;border-top:2px solid #d0dce8;">
      <div style="text-align:center;min-width:160px;">
        <div style="border-top:1.5px solid #333;padding-top:6px;margin-top:36px;font-size:0.75rem;color:#555;">Teacher Signature</div>
        <div style="font-size:0.7rem;color:#7a8ba0;">${teacher.name}</div>
      </div>
      <div style="text-align:center;min-width:160px;">
        <div style="border-top:1.5px solid #333;padding-top:6px;margin-top:36px;font-size:0.75rem;color:#555;">Academy Administration</div>
        <div style="font-size:0.7rem;color:#7a8ba0;">${settings.academyName}</div>
      </div>
    </div>
    <div style="margin-top:12px;text-align:center;font-size:0.65rem;color:#aaa;">${settings.academyName} — ${settings.address} — ${settings.phone}</div>
  </div>
  </body></html>`);
  win.document.close();
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard({students,teachers,attendance,settings,wpLog,classTimings}){
  const active=students.filter(s=>s.active);
  const todayKey=new Date().toISOString().split("T")[0];
  const todayAtt=Object.entries(attendance).filter(([k])=>k.startsWith(todayKey));
  const presentT=todayAtt.filter(([,v])=>v.status==="present").length;
  const absentT=todayAtt.filter(([,v])=>v.status==="absent").length;
  const lateT=todayAtt.filter(([,v])=>v.status==="late").length;
  const tmKey=`${CY}-${CM}`;
  const tmFees=active.map(s=>s.fees[tmKey]).filter(Boolean);
  const collected=tmFees.reduce((a,f)=>a+f.paid,0);
  const pending=tmFees.reduce((a,f)=>a+Math.max(0,f.totalFee-f.discount-f.paid),0);
  const totalDue=active.flatMap(s=>Object.values(s.fees)).reduce((a,f)=>a+Math.max(0,f.totalFee-f.discount-f.paid),0);

  const stats=[
    {label:"Total Students",value:active.length,sub:`${students.filter(s=>!s.active).length} inactive`,color:C.navy},
    {label:"Collected This Month",value:`Rs. ${fmt(collected)}`,sub:`${MONTHS[CM]} ${CY}`,color:C.green},
    {label:"Pending This Month",value:`Rs. ${fmt(pending)}`,sub:"To be collected",color:C.red},
    {label:"Total Outstanding",value:`Rs. ${fmt(totalDue)}`,sub:"All time",color:C.yellow},
    {label:"Present Today",value:presentT,sub:`${absentT} absent · ${lateT} late`,color:C.blue},
    {label:"Teachers",value:teachers.filter(t=>t.active).length,sub:"Active",color:C.gold},
  ];

  return <div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12,marginBottom:20}}>
      {stats.map(st=><div key={st.label} style={{background:C.white,borderRadius:12,padding:"16px 18px",boxShadow:"0 2px 10px rgba(0,0,0,0.06)",borderTop:`3px solid ${st.color}`}}>
        <div style={{fontSize:"0.68rem",color:C.textLight,fontWeight:700,textTransform:"uppercase",marginBottom:6}}>{st.label}</div>
        <div style={{fontSize:"1.35rem",fontWeight:900,color:st.color,marginBottom:3}}>{st.value}</div>
        <div style={{fontSize:"0.72rem",color:C.textLight}}>{st.sub}</div>
      </div>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
      <div style={S.card}>
        <SecTitle title={`Defaulters — ${MONTHS[CM]}`}/>
        {active.filter(s=>{const f=s.fees[tmKey];return f&&f.status!=="paid";}).slice(0,5).map(s=>{
          const f=s.fees[tmKey],bal=f?f.totalFee-f.discount-f.paid:0;
          return <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
            <div><div style={{fontWeight:700,fontSize:"0.87rem"}}>{s.name}</div><div style={{fontSize:"0.7rem",color:C.textLight}}>{s.class}</div></div>
            <div style={{textAlign:"right"}}><div style={{fontWeight:800,color:C.red}}>Rs. {fmt(bal)}</div><Badge status={f?.status||"unpaid"}/></div>
          </div>;
        })}
        {active.filter(s=>{const f=s.fees[tmKey];return f&&f.status!=="paid";}).length===0&&<div style={{textAlign:"center",padding:20,color:C.green,fontWeight:700}}>All fees collected</div>}
      </div>
      <div style={S.card}>
        <SecTitle title="Recent Alerts"/>
        {wpLog.length===0?<div style={{textAlign:"center",padding:20,color:C.textLight}}>No alerts yet</div>
          :wpLog.slice(0,5).map(a=><div key={a.id} style={{padding:"7px 0",borderBottom:`1px solid ${C.border}`,fontSize:"0.82rem"}}>
            <div style={{fontWeight:700}}>{a.studentName}</div>
            <div style={{color:C.textLight,display:"flex",justifyContent:"space-between"}}><span style={{textTransform:"capitalize"}}>{a.type}</span><span>{a.time}</span></div>
          </div>)}
      </div>
    </div>
    <div style={S.card}>
      <SecTitle title="Class Schedule Today"/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:10}}>
        {classTimings.map(ct=><div key={ct.id} style={{background:C.bg,borderRadius:9,padding:"10px 12px",borderLeft:`3px solid ${C.gold}`}}>
          <div style={{fontWeight:700,fontSize:"0.85rem"}}>{ct.class}</div>
          <div style={{fontSize:"0.72rem",color:C.textMid}}>{ct.shift}</div>
          <div style={{fontSize:"0.8rem",color:C.navy,fontWeight:700,marginTop:3}}>{ct.startTime} — {ct.endTime}</div>
        </div>)}
      </div>
    </div>
  </div>;
}

// ── STUDENTS ──────────────────────────────────────────────────────────────────
function Students({students,setStudents,teachers,settings,showToast,isSA}){
  const[search,setSearch]=useState("");
  const[fc,setFc]=useState("All");
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState(null);

  const filtered=students.filter(s=>s.active).filter(s=>{
    const q=search.toLowerCase();
    return(s.name.toLowerCase().includes(q)||s.fatherName.toLowerCase().includes(q)||s.phone.includes(q))&&(fc==="All"||s.class===fc);
  });

  function openAdd(){setForm({name:"",fatherName:"",phone:"",parentWP:"",class:"FSc Pre-Med",enrollYear:CY,enrollMonth:CM,regFee:0,subjects:[{subject:"",fee:"",discount:"0",teacherId:""}]});setModal("add");}
  function openEdit(s){setForm({...s,subjects:s.subjects.map(x=>({...x}))});setModal("edit");}

  function save(){
    if(!form.name.trim()){showToast("Name required","error");return;}
    if(!form.subjects[0]?.fee){showToast("At least one subject with fee required","error");return;}
    if(modal==="add"){
      const ns={...form,id:gid(),fees:{},active:true,enrollYear:parseInt(form.enrollYear),enrollMonth:parseInt(form.enrollMonth)};
      ns.fees=buildFees(ns);setStudents(p=>[...p,ns]);showToast(`${ns.name} added`);
    }else{
      setStudents(p=>p.map(s=>{if(s.id!==form.id)return s;const u={...form};u.fees=buildFees(u,s.fees);return u;}));
      showToast("Student updated");
    }
    setModal(null);setForm(null);
  }

  function addSub(){setForm(f=>({...f,subjects:[...f.subjects,{subject:"",fee:"",discount:"0",teacherId:""}]}));}
  function remSub(i){if(form.subjects.length===1)return;setForm(f=>({...f,subjects:f.subjects.filter((_,j)=>j!==i)}));}
  function updSub(i,k,v){setForm(f=>({...f,subjects:f.subjects.map((s,j)=>j===i?{...s,[k]:v}:s)}));}

  return <div>
    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search student..." style={{...S.input,flex:1,minWidth:160}}/>
      <select value={fc} onChange={e=>setFc(e.target.value)} style={{...S.select,width:"auto"}}>
        <option value="All">All Classes</option>{CLASSES.map(c=><option key={c}>{c}</option>)}
      </select>
      <button onClick={openAdd} style={S.btnPrimary}>+ Add Student</button>
    </div>
    <div style={{background:C.white,borderRadius:12,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.07)"}}>
      <table><thead><tr>{["Student","Father","Class","Subjects","Monthly Fee","WhatsApp","Actions"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
        <tbody>
          {filtered.map(s=>{
            const tf=s.subjects.reduce((a,x)=>a+(parseInt(x.fee)||0),0);
            return <tr key={s.id} onMouseEnter={e=>e.currentTarget.style.background=C.bg} onMouseLeave={e=>e.currentTarget.style.background=""}>
              <td style={S.td}><div style={{fontWeight:700}}>{s.name}</div><div style={{fontSize:"0.7rem",color:C.textLight}}>{s.phone}</div></td>
              <td style={S.td}>{s.fatherName}</td>
              <td style={S.td}><span style={{fontWeight:600}}>{s.class}</span></td>
              <td style={S.td}><div style={{display:"flex",gap:3,flexWrap:"wrap"}}>{s.subjects.map((x,i)=><span key={i} style={S.badge(C.navy,C.blueBg)}>{x.subject}</span>)}</div></td>
              <td style={S.td}><span style={{fontWeight:700,color:C.green}}>Rs. {fmt(tf)}</span></td>
              <td style={S.td}><span style={{fontSize:"0.8rem"}}>{s.parentWP}</span></td>
              <td style={S.td}><div style={{display:"flex",gap:5}}>
                <button onClick={()=>openEdit(s)} style={{...S.btnGhost,padding:"6px 10px",fontSize:"0.78rem"}}>Edit</button>
                <button onClick={()=>{setStudents(p=>p.map(x=>x.id===s.id?{...x,active:false}:x));showToast("Removed");}} style={{...S.btnDanger,padding:"6px 10px",fontSize:"0.78rem"}}>Remove</button>
              </div></td>
            </tr>;
          })}
          {filtered.length===0&&<tr><td colSpan={7} style={{...S.td,textAlign:"center",padding:40,color:C.textLight}}>No students found</td></tr>}
        </tbody>
      </table>
    </div>

    {(modal==="add"||modal==="edit")&&form&&(
      <Modal title={modal==="add"?"Add New Student":"Edit Student"} onClose={()=>{setModal(null);setForm(null);}} width={680}>
        <G2><Field label="Student Full Name *"><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} style={S.input}/></Field>
          <Field label="Father Name"><input value={form.fatherName} onChange={e=>setForm({...form,fatherName:e.target.value})} style={S.input}/></Field></G2>
        <G2><Field label="Phone"><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} style={S.input} placeholder="0300-0000000"/></Field>
          <Field label="Parent WhatsApp"><input value={form.parentWP} onChange={e=>setForm({...form,parentWP:e.target.value})} style={S.input} placeholder="03000000000"/></Field></G2>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:14}}>
          <Field label="Class" mb={0}><select value={form.class} onChange={e=>setForm({...form,class:e.target.value})} style={S.select}>{CLASSES.map(c=><option key={c}>{c}</option>)}</select></Field>
          <Field label="Enrollment Month" mb={0}><select value={form.enrollMonth} onChange={e=>setForm({...form,enrollMonth:parseInt(e.target.value)})} style={S.select}>{MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}</select></Field>
          <Field label="Enrollment Year" mb={0}><input type="number" value={form.enrollYear} onChange={e=>setForm({...form,enrollYear:e.target.value})} style={S.input}/></Field>
        </div>
        <Field label="Registration / Arrears Fee (Rs.)"><input type="number" value={form.regFee||0} onChange={e=>setForm({...form,regFee:parseInt(e.target.value)||0})} style={S.input}/></Field>
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <label style={S.label}>Subjects, Fees & Assigned Teachers</label>
            <button onClick={addSub} style={{...S.btnPrimary,padding:"5px 12px",fontSize:"0.78rem"}}>+ Add Subject</button>
          </div>
          {form.subjects.map((sub,i)=><div key={i} style={{background:C.bg,borderRadius:10,padding:12,marginBottom:10,border:`1px solid ${C.border}`}}>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr auto",gap:10,alignItems:"end",marginBottom:10}}>

              <div><label style={S.label}>Fee (Rs.)</label><input type="number" value={sub.fee} onChange={e=>updSub(i,"fee",e.target.value)} style={S.input}/></div>
              <div><label style={S.label}>Discount (Rs.)</label><input type="number" value={sub.discount} onChange={e=>updSub(i,"discount",e.target.value)} style={S.input}/></div>
              <button onClick={()=>remSub(i)} style={{...S.btnDanger,padding:"10px 12px",marginTop:18}} disabled={form.subjects.length===1}>×</button>
            </div>
            <div><label style={S.label}>Assigned Teacher</label>
              <select value={sub.teacherId} onChange={e=>updSub(i,"teacherId",e.target.value)} style={S.select}>
                <option value="">— Select Teacher —</option>
                {teachers.filter(t=>t.active).map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
              </select>
            </div>

          <div style={{background:C.navy,color:C.white,padding:"10px 14px",borderRadius:8,fontWeight:700,display:"flex",justifyContent:"space-between"}}>
            <span>Monthly Fee: Rs. {fmt(form.subjects.reduce((a,s)=>a+(parseInt(s.fee)||0),0))}</span>

}

// ── TEACHERS ──────────────────────────────────────────────────────────────────

            <td style={S.td}><div style={{display:"flex",gap:3,flexWrap:"wrap"}}>{t.subjects.map((s,i)=><span key={i} style={S.badge(C.navy,C.blueBg)}>{s}</span>)}</div></td>

            </div></td>

    {slipModal&&<Modal title={`Salary Slip — ${slipModal.name}`} onClose={()=>setSlipModal(null)} width={420}>

        <button onClick={()=>setSlipModal(null)} style={{...S.btnGhost,flex:1}}>Cancel</button>

    {(modal==="add"||modal==="edit")&&form&&(

          <Field label="Phone"><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} style={S.input}/></Field></G2>
        <Field label="CNIC"><input value={form.cnic} onChange={e=>setForm({...form,cnic:e.target.value})} style={S.input} placeholder="13101-0000000-0"/></Field>

}

// ── FEES ──────────────────────────────────────────────────────────────────────
function Fees({students,setStudents,teachers,settings,setSettings,showToast,isSA}){
  const[selId,setSelId]=useState("");
  const[modal,setModal]=useState(null);
  const[pf,setPf]=useState({amount:"",discount:"",feeKey:""});
  const sel=students.find(s=>s.id===selId);

  function recordPay(){
    const amt=parseInt(pf.amount)||0,dis=parseInt(pf.discount)||0;
    if(!amt){showToast("Enter amount","error");return;}
    setStudents(p=>p.map(s=>{
      if(s.id!==selId)return s;
      const fees={...s.fees},fee={...fees[pf.feeKey]};
      fee.discount=dis;fee.paid=Math.min(fee.paid+amt,fee.totalFee-dis);
      fee.paidDate=new Date().toLocaleDateString();
      fee.status=fee.paid>=(fee.totalFee-fee.discount)?"paid":fee.paid>0?"partial":"unpaid";
      fees[pf.feeKey]=fee;return{...s,fees};
    }));
    showToast("Payment recorded");setModal(null);
  }

  const active=students.filter(s=>s.active);

  return <div>
    <Field label="Select Student">
      <select value={selId} onChange={e=>setSelId(e.target.value)} style={S.select}>
        <option value="">— Select a student —</option>
        {active.map(s=><option key={s.id} value={s.id}>{s.name} ({s.class})</option>)}
      </select>
    </Field>
    {sel&&(()=>{
      const entries=Object.entries(sel.fees).sort(([a],[b])=>{const[ay,am]=a.split("-").map(Number),[by,bm]=b.split("-").map(Number);return by-ay||bm-am;});
      const totalPaid=entries.reduce((a,[,f])=>a+f.paid,0);
      const totalDue=entries.reduce((a,[,f])=>a+Math.max(0,f.totalFee-f.discount-f.paid),0);
      return <div>
        <div style={{...S.card,background:C.navy,color:C.white,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:900,fontSize:"1.1rem"}}>{sel.name}</div><div style={{opacity:0.6,fontSize:"0.8rem"}}>{sel.class} | {sel.subjects.map(x=>x.subject).join(", ")}</div></div>
          <div style={{display:"flex",gap:24}}>
            <div style={{textAlign:"right"}}><div style={{opacity:0.6,fontSize:"0.7rem",textTransform:"uppercase"}}>Total Paid</div><div style={{fontWeight:900,color:C.goldLight}}>Rs. {fmt(totalPaid)}</div></div>
            <div style={{textAlign:"right"}}><div style={{opacity:0.6,fontSize:"0.7rem",textTransform:"uppercase"}}>Total Due</div><div style={{fontWeight:900,color:"#ff9999"}}>Rs. {fmt(totalDue)}</div></div>
          </div>
        </div>
        <div style={{background:C.white,borderRadius:12,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.07)"}}>
          <table><thead><tr>{["Month","Challan No","Fee","Discount","Paid","Balance","Status","Actions"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>{entries.map(([key,fee])=>{
              const[y,m]=key.split("-").map(Number),bal=fee.totalFee-fee.discount-fee.paid;
              return <tr key={key} onMouseEnter={e=>e.currentTarget.style.background=C.bg} onMouseLeave={e=>e.currentTarget.style.background=""}>
                <td style={S.td}><span style={{fontWeight:700}}>{MONTHS[m]} {y}</span></td>
                <td style={S.td}><span style={{fontFamily:"monospace",fontSize:"0.82rem"}}>{pad(fee.challanNo||0)}</span></td>
                <td style={S.td}>Rs. {fmt(fee.totalFee)}</td>
                <td style={S.td}>{fee.discount>0?<span style={{color:C.green}}>Rs. {fmt(fee.discount)}</span>:"—"}</td>
                <td style={S.td}><span style={{color:C.green,fontWeight:700}}>Rs. {fmt(fee.paid)}</span></td>
                <td style={S.td}><span style={{color:bal>0?C.red:C.green,fontWeight:700}}>Rs. {fmt(bal)}</span></td>
                <td style={S.td}><Badge status={fee.status}/></td>
                <td style={S.td}><div style={{display:"flex",gap:5}}>
                  {(fee.status!=="paid"||isSA)&&<button onClick={()=>{setPf({amount:String(bal),discount:String(fee.discount||0),arrears:String(fee.arrears||0),feeKey:key});setModal("pay");}} style={{...S.btnGreen,padding:"5px 9px",fontSize:"0.75rem"}}>{isSA&&fee.status==="paid"?"Edit":"Pay"}</button>}
                  <button onClick={()=>printChallan(sel,fee,key,settings,teachers)} style={{...S.btnGold,padding:"5px 9px",fontSize:"0.75rem"}}>Challan</button>
                </div></td>
              </tr>;
            })}</tbody>
          </table>
        </div>
      </div>;
    })()}
    {modal==="pay"&&<Modal title="Record Payment" onClose={()=>setModal(null)} width={400}>
      <div style={{marginBottom:12,background:C.bg,borderRadius:8,padding:"10px 14px",fontSize:"0.85rem"}}>{sel?.name} — {pf.feeKey?`${MONTHS[parseInt(pf.feeKey.split("-")[1])]} ${pf.feeKey.split("-")[0]}`:""}</div>
      <Field label="Amount Paid (Rs.)"><input type="number" value={pf.amount} onChange={e=>setPf({...pf,amount:e.target.value})} style={S.input}/></Field>
      <Field label="Discount (Rs.)"><input type="number" value={pf.discount} onChange={e=>setPf({...pf,discount:e.target.value})} style={S.input}/></Field>
      <div style={{display:"flex",gap:10}}>
        <button onClick={recordPay} style={{...S.btnGreen,flex:1}}>Save Payment</button>
        <button onClick={()=>setModal(null)} style={{...S.btnGhost,flex:1}}>Cancel</button>
      </div>
    </Modal>}
  </div>;
}

// ── CHALLANS ──────────────────────────────────────────────────────────────────
function Challans({students,teachers,settings,wpLog,setWpLog,showToast}){
  const[sending,setSending]=useState(false);
  const active=students.filter(s=>s.active);

  function sendAll(){
    setSending(true);
    const logs=active.map(s=>{
      const key=`${CY}-${CM}`,fee=s.fees[key];if(!fee)return null;
      return{id:gid(),type:"challan",studentName:s.name,student:s,status:"sent",time:new Date().toLocaleTimeString(),month:CM,year:CY};
    }).filter(Boolean);
    setWpLog(p=>[...logs,...p]);
    setTimeout(()=>{setSending(false);showToast(`Sent to ${logs.length} parents`);},1200);

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <div>
        <div style={{fontWeight:800,fontSize:"1rem",color:C.navy}}>Monthly Challans — {MONTHS[CM]} {CY}</div>
        <div style={{color:C.textLight,fontSize:"0.82rem"}}>Generate & send fee challans to parents</div>
      </div>
      <button onClick={sendAll} disabled={sending} style={{...S.btnGreen,opacity:sending?0.7:1}}>{sending?"Sending...":`Send to All (${active.length})`}</button>

      <div style={{fontWeight:700,marginBottom:4}}>Auto Challan</div>
      <div style={{opacity:0.7,fontSize:"0.85rem"}}>Auto send on {settings.autoSendDay}th of every month — configurable in Settings</div>
    </div>
    <div style={{fontWeight:700,color:C.navy,marginBottom:10}}>Individual Challan Print</div>
    <div style={{background:C.white,borderRadius:12,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.07)"}}>
      <table><thead><tr>{["Student","Class","This Month Fee","Status","Action"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
        <tbody>{active.map(s=>{
          const key=`${CY}-${CM}`,fee=s.fees[key];
          const bal=fee?fee.totalFee-fee.discount-fee.paid:0;
          return <tr key={s.id} onMouseEnter={e=>e.currentTarget.style.background=C.bg} onMouseLeave={e=>e.currentTarget.style.background=""}>
            <td style={S.td}><span style={{fontWeight:700}}>{s.name}</span></td>
            <td style={S.td}>{s.class}</td>
            <td style={S.td}>Rs. {fmt(fee?.totalFee||0)}</td>
            <td style={S.td}>{fee?<Badge status={fee.status}/>:"—"}</td>
            <td style={S.td}>{fee&&<button onClick={()=>printChallan(s,fee,key,settings,teachers)} style={{...S.btnGold,padding:"6px 12px",fontSize:"0.78rem"}}>Print Challan</button>}</td>
          </tr>;
        })}</tbody>
      </table>
    </div>
  </div>;
}

// ── ATTENDANCE ────────────────────────────────────────────────────────────────
function Attendance({students,teachers,attendance,setAttendance,teacherAtt,setTeacherAtt,classTimings,settings,showToast,setWpLog,isSA}){
  const[viewDate,setViewDate]=useState(new Date().toISOString().split("T")[0]);
  const[scanning,setScanning]=useState(false);
  const[activeTab,setActiveTab]=useState("students");
  const ct=new Date().toLocaleTimeString();

  function mark(sid,status,isTeacher=false){
    const key=`${viewDate}-${sid}`;
    if(isTeacher){setTeacherAtt(p=>({...p,[key]:{status,time:ct}}));}
    else{
      setAttendance(p=>({...p,[key]:{status,time:ct}}));
      if(status==="absent"||status==="late"){
        const s=students.find(x=>x.id===sid);
        if(s){setWpLog(p=>[{id:gid(),type:status==="absent"?"Absent Alert":"Late Alert",studentName:s.name,status:"sent",time:ct},...p]);}
      }
    }
  }

  function simulateScan(){
    setScanning(true);
    const list=activeTab==="students"?students.filter(s=>s.active):teachers.filter(t=>t.active);
    list.forEach((item,i)=>setTimeout(()=>{
      const r=Math.random();
      mark(item.id,r>0.8?"absent":r>0.6?"late":"present",activeTab==="teachers");
      if(i===list.length-1)setTimeout(()=>setScanning(false),400);
    },i*250));
  }

  const list=activeTab==="students"?students.filter(s=>s.active):teachers.filter(t=>t.active);
  const attSrc=activeTab==="students"?attendance:teacherAtt;
  const summary={present:0,late:0,absent:0};
  list.forEach(item=>{const r=attSrc[`${viewDate}-${item.id}`];if(r)summary[r.status]=(summary[r.status]||0)+1;});

  return <div>
    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
      <input type="date" value={viewDate} onChange={e=>setViewDate(e.target.value)} style={{...S.input,width:"auto"}}/>
      <div style={{display:"flex",background:C.bg,borderRadius:9,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        {["students","teachers"].map(t=><button key={t} onClick={()=>setActiveTab(t)} style={{padding:"9px 16px",background:activeTab===t?C.navy:"transparent",color:activeTab===t?C.white:C.text,border:"none",cursor:"pointer",fontWeight:600,fontSize:"0.85rem",textTransform:"capitalize",fontFamily:"inherit"}}>{t}</button>)}
      </div>
      <button onClick={simulateScan} disabled={scanning} style={{...S.btnPrimary,opacity:scanning?0.7:1}}>{scanning?"Scanning...":"Simulate Biometric"}</button>
      <button onClick={()=>printAttendance(list,attSrc,viewDate,activeTab,settings)} style={S.btnGold}>Print Attendance</button>
      {isSA&&<button onClick={()=>{if(window.confirm("Clear all attendance for "+viewDate+"?")){{const keys=Object.keys(activeTab==="students"?attendance:teacherAtt).filter(k=>k.startsWith(viewDate));if(activeTab==="students"){setAttendance(p=>{const n={...p};keys.forEach(k=>delete n[k]);return n;});}else{setTeacherAtt(p=>{const n={...p};keys.forEach(k=>delete n[k]);return n;});}}showToast("Attendance cleared for "+viewDate);}}} style={{...S.btnDanger,padding:"9px 14px",fontSize:"0.82rem"}}>Clear Day</button>}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
      {[["Present",summary.present,C.green,C.greenBg],["Late",summary.late,C.yellow,C.yellowBg],["Absent",summary.absent,C.red,C.redBg]].map(([l,v,c,bg])=>
        <div key={l} style={{background:bg,borderRadius:10,padding:"12px 16px",borderLeft:`3px solid ${c}`}}>
          <div style={{fontSize:"0.7rem",color:c,fontWeight:700,textTransform:"uppercase"}}>{l}</div>
          <div style={{fontSize:"1.5rem",fontWeight:900,color:c}}>{v}</div>
        </div>)}
    </div>
    <div style={{background:C.white,borderRadius:12,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.07)"}}>
      <table><thead><tr>{["Name",activeTab==="students"?"Class":"Subjects","Status","Time","Sign In","Sign Out","Hours","Mark"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
        <tbody>{list.map(item=>{
          const key=`${viewDate}-${item.id}`,rec=attSrc[key];
          return <tr key={item.id} style={{background:rec?.status==="late"?"#fffde7":""}} onMouseEnter={e=>e.currentTarget.style.background=rec?.status==="late"?"#fff9c4":C.bg} onMouseLeave={e=>e.currentTarget.style.background=rec?.status==="late"?"#fffde7":""}>
            <td style={S.td}><div style={{fontWeight:700}}>{item.name}</div>{activeTab==="students"&&<div style={{fontSize:"0.7rem",color:C.textLight}}>{item.fatherName}</div>}</td>
            <td style={S.td}>{activeTab==="students"?item.class:item.subjects?.join(", ")}</td>
            <td style={S.td}>{rec?<Badge status={rec.status}/>:<span style={{color:C.textLight,fontSize:"0.82rem"}}>Not marked</span>}</td>
            <td style={S.td}><b style={{color:C.green}}>{rec?.in_time||"—"}</b></td><td style={S.td}><b style={{color:C.red}}>{rec?.out_time||"—"}</b></td><td style={S.td}>{rec?.total_hours||"—"}</td>
            <td style={S.td}><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {!rec?.in_time&&<button onClick={()=>{
                const k=`${viewDate}-${item.id}`;
                const t=new Date().toTimeString().slice(0,5);
                const nowMin=parseInt(t.split(":")[0])*60+parseInt(t.split(":")[1]);
                const timing=classTimings.find(ct=>ct.class===item.class&&ct.day===["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(viewDate).getDay()]);
                let status="present";
                if(timing&&activeTab==="students"){const[h,m]=timing.startTime.split(":").map(Number);if(nowMin-(h*60+m)>(settings.lateMinutes||15))status="late";}
                const rec2={status,in_time:t,out_time:null,total_hours:null};
                if(activeTab==="teachers"){setTeacherAtt(p=>({...p,[k]:rec2}));}
                else{setAttendance(p=>({...p,[k]:rec2}));if(status==="late"){const s2=students.find(x=>x.id===item.id);if(s2)setWpLog(prev=>[{id:gid(),type:"Late Alert",studentName:s2.name,status:"sent",time:t},...prev]);}}
                showToast(item.name+" signed in");
              }} style={{background:C.green,color:C.white,border:"none",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:"0.72rem",fontWeight:700}}>Sign In</button>}
              {rec?.in_time&&!rec?.out_time&&<button onClick={()=>{
                const k=`${viewDate}-${item.id}`;
                const t=new Date().toTimeString().slice(0,5);
                const[ih,im]=rec.in_time.split(":").map(Number);
                const[oh,om]=t.split(":").map(Number);
                const diff=(oh*60+om)-(ih*60+im);
                const hours=diff>0?Math.floor(diff/60)+"h "+(diff%60)+"m":null;
                const upd={...rec,out_time:t,total_hours:hours};
                if(activeTab==="teachers"){setTeacherAtt(p=>({...p,[k]:upd}));}
                else setAttendance(p=>({...p,[k]:upd}));
                showToast(item.name+" signed out"+(hours?" — "+hours:""));
              }} style={{background:C.red,color:C.white,border:"none",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:"0.72rem",fontWeight:700}}>Sign Out</button>}
              {["present","late","absent","leave"].map(s=><button key={s} onClick={()=>mark(item.id,s,activeTab==="teachers")}
                style={{padding:"3px 6px",border:`1px solid ${s==="present"?C.green:s==="late"?C.yellow:s==="absent"?C.red:"#888"}`,
                  background:rec?.status===s?(s==="present"?C.greenBg:s==="late"?C.yellowBg:s==="absent"?C.redBg:"#eee"):"transparent",
                  color:s==="present"?C.green:s==="late"?C.yellow:s==="absent"?C.red:"#888",
                  borderRadius:6,cursor:"pointer",fontSize:"0.68rem",fontWeight:700,fontFamily:"inherit"}}>
                {s.charAt(0).toUpperCase()+s.slice(1)}
              </button>)}
            </div></td>
          </tr>;
        })}</tbody>
      </table>
    </div>
    <div style={{...S.card,marginTop:14}}>
      <div style={{fontWeight:700,marginBottom:6,color:C.navy}}>Alert Rules</div>
      <div style={{fontSize:"0.85rem",color:C.textMid}}>Student absent → Parent WhatsApp immediately. Student late → Parent notified. Teacher attendance → recorded only, no messages sent.</div>
    </div>
  </div>;
}

function Reports({students,teachers,attendance,teacherAtt,settings}){
  const[rType,setRType]=useState("fee");
  const[month,setMonth]=useState(CM);
  const[year,setYear]=useState(CY);
  const[selStudent,setSelStudent]=useState("");
  const[selTeacher,setSelTeacher]=useState("");
  const active=students.filter(s=>s.active);
  const key=`${year}-${month}`;

  const feeReport=active.map(s=>{const f=s.fees[key];return{name:s.name,class:s.class,fee:f?.totalFee||0,discount:f?.discount||0,paid:f?.paid||0,balance:f?Math.max(0,f.totalFee-f.discount-f.paid):0,status:f?.status||"no record"};});
  const tFee=feeReport.reduce((a,r)=>a+r.fee,0),tPaid=feeReport.reduce((a,r)=>a+r.paid,0),tBal=feeReport.reduce((a,r)=>a+r.balance,0);

  const teacherReport=teachers.filter(t=>t.active).map(t=>{
    const assigned=active.filter(s=>s.subjects.some(x=>x.teacherId===t.id));
    const revenue=assigned.reduce((a,s)=>a+s.subjects.filter(x=>x.teacherId===t.id).reduce((b,x)=>b+(parseInt(x.fee)||0),0),0);
    const commission=t.commissionType==="percentage"?Math.round(revenue*t.commissionValue/100):assigned.length*(parseInt(t.commissionValue)||0);
    return{name:t.name,students:assigned.length,revenue,commission};
  });

  const attReport=active.map(s=>{
    const keys=Object.keys(attendance).filter(k=>k.endsWith(`-${s.id}`));
    const p=keys.filter(k=>attendance[k].status==="present").length;
    const l=keys.filter(k=>attendance[k].status==="late").length;
    const a=keys.filter(k=>attendance[k].status==="absent").length;
    return{name:s.name,class:s.class,present:p,late:l,absent:a,total:keys.length,rate:keys.length>0?Math.round((p/keys.length)*100):0};
  });

  const tAttReport=teachers.filter(t=>t.active).map(t=>{
    const keys=Object.keys(teacherAtt).filter(k=>k.endsWith(`-${t.id}`));
    const p=keys.filter(k=>teacherAtt[k].status==="present").length;
    const l=keys.filter(k=>teacherAtt[k].status==="late").length;
    const a=keys.filter(k=>teacherAtt[k].status==="absent").length;
    return{name:t.name,present:p,late:l,absent:a,total:keys.length,rate:keys.length>0?Math.round((p/keys.length)*100):0};
  });

  return <div>
    <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap"}}>
      <div style={{display:"flex",background:C.bg,borderRadius:9,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        {[["fee","Fee Collection"],["teacher","Teacher Commission"],["attendance","Student Attendance"],["teacherAtt","Teacher Attendance"]].map(([id,label])=>
          <button key={id} onClick={()=>setRType(id)} style={{padding:"9px 14px",background:rType===id?C.navy:"transparent",color:rType===id?C.white:C.text,border:"none",cursor:"pointer",fontWeight:600,fontSize:"0.82rem",fontFamily:"inherit"}}>{label}</button>)}
      </div>
      {rType==="fee"&&<div style={{display:"flex",gap:8}}>
        <select value={month} onChange={e=>setMonth(parseInt(e.target.value))} style={{...S.select,width:"auto"}}>{MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}</select>
        <select value={year} onChange={e=>setYear(parseInt(e.target.value))} style={{...S.select,width:"auto"}}>{[CY-1,CY,CY+1].map(y=><option key={y}>{y}</option>)}</select>
      </div>}
    </div>

    {rType==="fee"&&<div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:14}}>
        {[["Total Billed",fmt(tFee),C.navy],["Collected",fmt(tPaid),C.green],["Outstanding",fmt(tBal),C.red]].map(([l,v,c])=>
          <div key={l} style={{background:C.white,borderRadius:10,padding:"14px 18px",boxShadow:"0 2px 10px rgba(0,0,0,0.06)",borderTop:`3px solid ${c}`}}>
            <div style={{fontSize:"0.7rem",color:C.textLight,fontWeight:700,textTransform:"uppercase",marginBottom:5}}>{l}</div>
            <div style={{fontSize:"1.3rem",fontWeight:900,color:c}}>Rs. {v}</div>
          </div>)}
      </div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:8}}>
        <button onClick={()=>{
          const headers=["Student","Class","Fee","Discount","Paid","Balance","Status"];
          const rows=feeReport.map(r=>[r.name,r.class,`Rs.${fmt(r.fee)}`,r.discount>0?`Rs.${fmt(r.discount)}`:"—",`Rs.${fmt(r.paid)}`,`Rs.${fmt(r.balance)}`,r.status.toUpperCase()]);
          const cards=[["Total Billed",`Rs.${fmt(tFee)}`,"navy"],["Collected",`Rs.${fmt(tPaid)}`,"green"],["Outstanding",`Rs.${fmt(tBal)}`,"red"]];
          printReportPDF(`Fee Collection Report — ${MONTHS[month]} ${year}`,headers,rows,cards,settings);
        }} style={{...S.btnGold,padding:"8px 16px",fontSize:"0.82rem"}}>🖨 Print Report PDF</button>
      </div>
      <div style={{background:C.white,borderRadius:12,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.07)"}}>
        <table><thead><tr>{["Student","Class","Fee","Discount","Paid","Balance","Status"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>{feeReport.map((r,i)=><tr key={i} onMouseEnter={e=>e.currentTarget.style.background=C.bg} onMouseLeave={e=>e.currentTarget.style.background=""}>

          const headers=["Teacher","Students","Revenue","Commission Due"];
          const rows=teacherReport.map(r=>[r.name,r.students,`Rs.${fmt(r.revenue)}`,`Rs.${fmt(r.commission)}`]);
          printReportPDF(`Teacher Commission Report — ${MONTHS[month]} ${year}`,headers,rows,[],settings);
        }} style={{...S.btnGold,padding:"8px 16px",fontSize:"0.82rem"}}>🖨 Print Report PDF</button>
      </div>
      <div style={{background:C.white,borderRadius:12,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.07)"}}>
        <table><thead><tr>{["Teacher","Students","Revenue","Commission Due"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>{teacherReport.map((r,i)=><tr key={i} onMouseEnter={e=>e.currentTarget.style.background=C.bg} onMouseLeave={e=>e.currentTarget.style.background=""}>
            <td style={S.td}><span style={{fontWeight:700}}>{r.name}</span></td>
            <td style={S.td}>{r.students}</td>
            <td style={S.td}>Rs. {fmt(r.revenue)}</td>
            <td style={S.td}><span style={{fontWeight:900,color:C.gold,fontSize:"1rem"}}>Rs. {fmt(r.commission)}</span></td>
          </tr>)}</tbody>
        </table>
      </div>
    </div>}

    {rType==="attendance"&&<div>
      <div style={{display:"flex",gap:10,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
        <select value={selStudent} onChange={e=>setSelStudent(e.target.value)} style={{...S.select,width:"auto",minWidth:220}}>
          <option value="">— All Students (Summary) —</option>
          {active.map(s=><option key={s.id} value={s.id}>{s.name} ({s.class})</option>)}

        {selStudent&&<button onClick={()=>{
          const s=active.find(x=>x.id===selStudent);
          if(!s)return;
          const recs=Object.entries(attendance).filter(([k])=>k.endsWith(`-${s.id}`)).map(([k,v])=>({date:k.split(`-${s.id}`)[0],...v})).sort((a,b)=>b.date.localeCompare(a.date));
          printIndividualAttPDF(s,recs,"Student",settings);
        }} style={{...S.btnGold,padding:"8px 16px",fontSize:"0.82rem"}}>🖨 Print Individual PDF</button>}
        {!selStudent&&<button onClick={()=>{
          const headers=["Student","Class","Present","Late","Absent","Total","Rate"];

function ChangePW({currentUser,users,setUsers,setCurrentUser,onClose,showToast}){
  const[form,setForm]=useState({current:"",newPass:"",confirm:""});
  const[err,setErr]=useState("");
  function save(){
    if(form.current!==currentUser.password){setErr("Current password incorrect");return;}
    if(form.newPass.length<6){setErr("Min 6 characters");return;}
    if(form.newPass!==form.confirm){setErr("Passwords do not match");return;}
    const u={...currentUser,password:form.newPass};
    setUsers(p=>p.map(x=>x.id===currentUser.id?u:x));setCurrentUser(u);
    showToast("Password changed");onClose();
  }
  return <Modal title="Change Password" onClose={onClose} width={380}>
    <Field label="Current Password"><input type="password" value={form.current} onChange={e=>setForm({...form,current:e.target.value})} style={S.input}/></Field>
    <Field label="New Password"><input type="password" value={form.newPass} onChange={e=>setForm({...form,newPass:e.target.value})} style={S.input}/></Field>
    <Field label="Confirm New Password"><input type="password" value={form.confirm} onChange={e=>setForm({...form,confirm:e.target.value})} style={S.input}/></Field>
    {err&&<div style={{background:C.redBg,color:C.red,padding:"9px 12px",borderRadius:8,fontSize:"0.83rem",fontWeight:600,marginBottom:12}}>{err}</div>}
    <div style={{display:"flex",gap:10}}>
      <button onClick={save} style={{...S.btnPrimary,flex:1}}>Update Password</button>
      <button onClick={onClose} style={{...S.btnGhost,flex:1}}>Cancel</button>
    </div>
  </Modal>;
}


function printAttendance(list, attendance, date, type, settings) {
  const dayName = new Date(date).toLocaleDateString("en-PK", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  const rows = list.map(item => {
    const key = `${date}-${item.id}`;
    const rec = attendance[key];
    let status = "Not Marked", color = "#999", bg = "white";
    if (rec) {
      if (rec.status === "present") { status = "Present"; color = "#1a7a42"; bg = "#f0faf4"; }
      else if (rec.status === "late") { status = "Late"; color = "#b07000"; bg = "#fffbf0"; }
      else if (rec.status === "absent") { status = "Absent"; color = "#b02020"; bg = "#fff5f5"; }
      else if (rec.status === "leave") { status = "Leave"; color = "#555"; bg = "#f5f5f5"; }
    }
    return `<tr style="background:${bg};">
      <td style="padding:7px 12px;border-bottom:1px solid #eee;font-weight:700;font-size:0.82rem;">${item.name}</td>
      <td style="padding:7px 12px;border-bottom:1px solid #eee;font-size:0.8rem;color:#555;">${type === "students" ? (item.fatherName || "—") : (item.subjects?.join(", ") || "—")}</td>
      <td style="padding:7px 12px;border-bottom:1px solid #eee;font-size:0.8rem;color:#555;">${type === "students" ? item.class : "Teacher"}</td>
      <td style="padding:7px 12px;border-bottom:1px solid #eee;font-weight:700;font-size:0.82rem;color:${color};">${status}</td>
      <td style="padding:7px 12px;border-bottom:1px solid #eee;font-size:0.78rem;color:#777;">${rec?.time || "—"}</td>
      <td style="padding:7px 12px;border-bottom:1px solid #eee;"></td>
    </tr>`;
  }).join("");

  const present = list.filter(item => attendance[`${date}-${item.id}`]?.status === "present").length;
  const late = list.filter(item => attendance[`${date}-${item.id}`]?.status === "late").length;
  const absent = list.filter(item => attendance[`${date}-${item.id}`]?.status === "absent").length;

  const win = window.open("", "_blank");
  win.document.write(`<!DOCTYPE html><html><head><title>Attendance — ${dayName}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"Segoe UI",sans-serif;background:white;color:#1a2740;}
    .print-btn{background:#0f2744;color:white;border:none;padding:9px 22px;border-radius:7px;cursor:pointer;font-size:0.88rem;font-weight:700;}
    @media print{.no-print{display:none!important;}@page{size:A4;margin:10mm;}}
  </style></head><body>
  <div class="no-print" style="padding:12px 20px;background:#f0f4f8;border-bottom:2px solid #0f2744;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-weight:700;color:#0f2744;">${type === "students" ? "Student" : "Teacher"} Attendance — ${dayName}</span>
    <button class="print-btn" onclick="window.print()">Print Attendance</button>
  </div>

  <!-- Header -->
  <div style="background:#0f2744;color:white;padding:14px 24px;display:flex;align-items:center;gap:16px;">
    <img src="${LOGO}" style="height:48px;"/>
    <div style="flex:1;">
      <div style="font-size:1rem;font-weight:900;letter-spacing:1px;">${settings.academyName.toUpperCase()}</div>
      <div style="opacity:0.65;font-size:0.72rem;margin-top:2px;">${type === "students" ? "STUDENT" : "TEACHER"} ATTENDANCE REGISTER</div>
      <div style="opacity:0.65;font-size:0.7rem;">${settings.address}</div>
    </div>
    <div style="text-align:right;background:rgba(255,255,255,0.1);padding:10px 16px;border-radius:8px;">
      <div style="font-size:0.6rem;opacity:0.7;text-transform:uppercase;">Date</div>
      <div style="font-size:0.88rem;font-weight:900;">${dayName}</div>
    </div>
  </div>

  <div style="padding:16px 24px;">
    <!-- Summary -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;">
      ${[["Total", list.length, "#0f2744", "#e8f0fb"], ["Present", present, "#1a7a42", "#e6f4ec"], ["Late", late, "#b07000", "#fff4e0"], ["Absent", absent, "#b02020", "#fde8e8"]]
        .map(([l, v, c, bg]) => `<div style="background:${bg};border-radius:8px;padding:10px 14px;text-align:center;border:1.5px solid ${c};">
          <div style="font-size:0.65rem;color:${c};font-weight:700;text-transform:uppercase;">${l}</div>
          <div style="font-size:1.5rem;font-weight:900;color:${c};">${v}</div>
        </div>`).join("")}
    </div>

    <!-- Table -->
    <table style="width:100%;border:1.5px solid #d0dce8;border-radius:8px;overflow:hidden;">
      <thead><tr style="background:#0f2744;color:white;">
        <th style="padding:9px 12px;text-align:left;font-size:0.75rem;">Name</th>
        <th style="padding:9px 12px;text-align:left;font-size:0.75rem;">${type === "students" ? "Father Name" : "Subjects"}</th>
        <th style="padding:9px 12px;text-align:left;font-size:0.75rem;">${type === "students" ? "Class" : "Role"}</th>
        <th style="padding:9px 12px;text-align:left;font-size:0.75rem;">Status</th>
        <th style="padding:9px 12px;text-align:left;font-size:0.75rem;">Time</th>
        <th style="padding:9px 12px;text-align:left;font-size:0.75rem;">Signature</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>

    <!-- Signatures -->
    <div style="display:flex;justify-content:space-between;margin-top:24px;padding-top:14px;border-top:2px solid #d0dce8;">
      <div style="text-align:center;min-width:150px;">
        <div style="border-top:1.5px solid #333;padding-top:5px;margin-top:32px;font-size:0.72rem;color:#555;">Prepared By</div>
      </div>
      <div style="text-align:center;min-width:150px;">
        <div style="border-top:1.5px solid #333;padding-top:5px;margin-top:32px;font-size:0.72rem;color:#555;">Academy Administration</div>
      </div>
    </div>
    <div style="margin-top:10px;text-align:center;font-size:0.62rem;color:#aaa;">${settings.academyName} — ${settings.address} — Printed: ${new Date().toLocaleString()}</div>
  </div>
  </body></html>`);
  win.document.close();
}


// SCHEDULE COMPONENT
function Schedule({classTimings,setClassTimings,students,showToast}){
  const[selDay,setSelDay]=useState(["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()]);
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState(null);
  const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const CLASSES2=["Class 1","Class 2","Class 3","Class 4","Class 5","Class 6","Class 7","Class 8","Class 9","Class 10","O-Level","IGCSE","A-Level","AS-Level","A2-Level","FSc Pre-Med","FSc Pre-Eng","FA"];
  const dayTim=classTimings.filter(t=>t.day===selDay).sort((a,b)=>a.startTime.localeCompare(b.startTime));
  function save(){
    if(modal==="add")setClassTimings(p=>[...p,{...form,id:gid()}]);
    else setClassTimings(p=>p.map(t=>t.id===form.id?form:t));
    showToast("Saved");setModal(null);setForm(null);
  }
  return <div>
    <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
      <div style={{display:"flex",background:C.bg,borderRadius:9,border:`1px solid ${C.border}`,overflow:"hidden",flexWrap:"wrap"}}>
        {DAYS.map(d=><button key={d} onClick={()=>setSelDay(d)} style={{padding:"8px 12px",background:selDay===d?C.navy:"transparent",color:selDay===d?C.white:C.text,border:"none",cursor:"pointer",fontWeight:600,fontSize:"0.82rem",fontFamily:"inherit"}}>{d.slice(0,3)}</button>)}
      </div>
      <button onClick={()=>{setForm({class:"FSc Pre-Med",day:selDay,shift:"Morning",startTime:"08:00",endTime:"10:00"});setModal("add");}} style={S.btnPrimary}>+ Add Timing</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:8,marginBottom:16}}>
      {DAYS.map(day=>{
        const dt=classTimings.filter(t=>t.day===day).sort((a,b)=>a.startTime.localeCompare(b.startTime));
        const isToday=day===DAYS[new Date().getDay()];
        return <div key={day} style={{background:C.white,borderRadius:10,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
          <div style={{background:isToday?C.gold:C.navy,color:C.white,padding:"8px 10px",textAlign:"center",fontWeight:700,fontSize:"0.82rem"}}>{day.slice(0,3)}{isToday?" ★":""}</div>
          <div style={{padding:"8px"}}>
            {dt.length===0?<div style={{textAlign:"center",padding:"8px 0",color:C.textLight,fontSize:"0.72rem"}}>No class</div>
              :dt.map(t=><div key={t.id} style={{background:C.bg,borderRadius:6,padding:"5px 8px",marginBottom:4,borderLeft:`3px solid ${C.gold}`}}>
                <div style={{fontWeight:700,fontSize:"0.75rem"}}>{t.class}</div>
                <div style={{fontSize:"0.68rem",color:C.textMid}}>{t.startTime}–{t.endTime}</div>
              </div>)}
          </div>
        </div>;
      })}
    </div>
    <div style={{background:C.white,borderRadius:12,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.07)"}}>
      <div style={{background:C.navy,color:C.white,padding:"12px 16px",fontWeight:700}}>{selDay} — Detailed Schedule</div>
      <table><thead><tr>{["Class","Shift","Start","End","Students","Actions"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
        <tbody>
          {dayTim.length===0&&<tr><td colSpan={6} style={{...S.td,textAlign:"center",padding:32,color:C.textLight}}>No classes on {selDay} — Click "+ Add Timing" to add</td></tr>}
          {dayTim.map(t=>{
            const cnt=students.filter(s=>s.active&&s.class===t.class).length;
            return <tr key={t.id} onMouseEnter={e=>e.currentTarget.style.background=C.bg} onMouseLeave={e=>e.currentTarget.style.background=""}>
              <td style={S.td}><span style={{fontWeight:700}}>{t.class}</span></td>
              <td style={S.td}>{t.shift}</td>
              <td style={S.td}><strong>{t.startTime}</strong></td>
              <td style={S.td}><strong>{t.endTime}</strong></td>
              <td style={S.td}><span style={{fontWeight:700,color:C.navy}}>{cnt} students</span></td>
              <td style={S.td}><div style={{display:"flex",gap:5}}>
                <button onClick={()=>{setForm({...t});setModal("edit");}} style={{...S.btnGhost,padding:"5px 9px",fontSize:"0.75rem"}}>Edit</button>
                <button onClick={()=>{setClassTimings(p=>p.filter(x=>x.id!==t.id));showToast("Removed");}} style={{...S.btnDanger,padding:"5px 9px",fontSize:"0.75rem"}}>Remove</button>
              </div></td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>
    {(modal==="add"||modal==="edit")&&form&&<Modal title={modal==="add"?"Add Timing":"Edit Timing"} onClose={()=>{setModal(null);setForm(null);}} width={400}>
      <Field label="Class"><select value={form.class} onChange={e=>setForm({...form,class:e.target.value})} style={S.select}>{CLASSES2.map(c=><option key={c}>{c}</option>)}</select></Field>
      <Field label="Day"><select value={form.day} onChange={e=>setForm({...form,day:e.target.value})} style={S.select}>{DAYS.map(d=><option key={d}>{d}</option>)}</select></Field>
      <Field label="Shift"><select value={form.shift} onChange={e=>setForm({...form,shift:e.target.value})} style={S.select}><option>Morning</option><option>Afternoon</option><option>Evening</option></select></Field>
      <G2><Field label="Start Time"><input type="time" value={form.startTime} onChange={e=>setForm({...form,startTime:e.target.value})} style={S.input}/></Field>
        <Field label="End Time"><input type="time" value={form.endTime} onChange={e=>setForm({...form,endTime:e.target.value})} style={S.input}/></Field></G2>
      <div style={{display:"flex",gap:10}}><button onClick={save} style={{...S.btnPrimary,flex:1}}>Save</button><button onClick={()=>{setModal(null);setForm(null);}} style={{...S.btnGhost,flex:1}}>Cancel</button></div>
    </Modal>}
  </div>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
